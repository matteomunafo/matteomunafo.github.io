baseURL = "https://matteomunafo.github.io/"
languageCode = "en-us"
title = "Matteo Francesco Munafò"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[params]
  env = "production"
  mainSections = ["research", "publications", "seminars"]
  title = "Matteo Francesco Munafò"
  description = "Matteo Francesco Munafò — higher category theory for algebraic geometry, higher topoi and homotopy type theory."
  keywords = ["Matteo Francesco Munafò", "higher category theory", "higher topoi", "homotopy type theory", "algebraic geometry"]
  author = "Matteo Francesco Munafò"
  images = ["images/profile.jpg"]
  DateFormat = "January 2006"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false
  ShowPageNums = false
  comments = false
  hidemeta = true
  hideSummary = false
  showtoc = false
  tocopen = false

  # Small round photo at the top left, next to the name.
  # To change the photo, replace static/images/profile.jpg (same file name).
  [params.label]
    text = "Matteo Francesco Munafò"
    icon = "/images/profile.jpg"
    iconHeight = 34

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.ico"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:matteo.munafo02@gmail.com"

  # To show a GitHub icon too, remove the "#" from the next three lines:
  # [[params.socialIcons]]
  #   name = "github"
  #   url = "https://github.com/matteomunafo"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[[menu.main]]
  identifier = "research"
  name = "Research"
  url = "/research/"
  weight = 10

[[menu.main]]
  identifier = "publications"
  name = "Publications"
  url = "/publications/"
  weight = 15

[[menu.main]]
  identifier = "seminars"
  name = "Seminars"
  url = "/seminars/"
  weight = 20

[[menu.main]]
  identifier = "cv"
  name = "CV"
  url = "/cv/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]
